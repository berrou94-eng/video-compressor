          package com.omar.videotoolkit

          import android.content.ContentValues
          import android.content.Context
          import android.content.Intent
          import android.graphics.Bitmap
          import android.media.MediaExtractor
          import android.media.MediaFormat
          import android.media.MediaMetadataRetriever
          import android.net.Uri
          import android.os.Build
          import android.os.Environment
          import android.provider.MediaStore
          import android.provider.OpenableColumns
          import androidx.core.content.FileProvider
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.File
          import java.io.FileInputStream

          /** معلومات الفيديو المختار */
          data class VInfo(
              val uri: Uri,
              val name: String,
              val size: Long,
              val width: Int,          // بعد مراعاة الدوران
              val height: Int,
              val durationMs: Long,
              val rotation: Int,
              val hasAudio: Boolean,
              val audioBitrate: Int,
              val sampleRate: Int,
              val channels: Int,
              val videoMime: String?,
              val audioMime: String?,
              val fps: Float,
          ) {
              val durationSec get() = durationMs / 1000f
              /** معدل البت الإجمالي (بت/ثانية) */
              val totalBitrate get() = if (size > 0 && durationMs > 0) size * 8 * 1000 / durationMs else 0L
              val shortSide get() = minOf(width, height)
          }

          object Media {

              fun probe(ctx: Context, uri: Uri): VInfo {
                  var name = "video.mp4"
                  var size = -1L
                  try {
                      ctx.contentResolver.query(uri, null, null, null, null)?.use { c ->
                          if (c.moveToFirst()) {
                              val ni = c.getColumnIndex(OpenableColumns.DISPLAY_NAME)
                              val si = c.getColumnIndex(OpenableColumns.SIZE)
                              if (ni >= 0) name = c.getString(ni) ?: name
                              if (si >= 0 && !c.isNull(si)) size = c.getLong(si)
                          }
                      }
                  } catch (_: Exception) {}

                  var w = 0; var h = 0; var rot = 0; var dur = 0L
                  val mmr = MediaMetadataRetriever()
                  try {
                      mmr.setDataSource(ctx, uri)
                      w = mmr.extractMetadata(MediaMetadataRetriever.METADATA_KEY_VIDEO_WIDTH)?.toIntOrNull() ?: 0
                      h = mmr.extractMetadata(MediaMetadataRetriever.METADATA_KEY_VIDEO_HEIGHT)?.toIntOrNull() ?: 0
                      rot = mmr.extractMetadata(MediaMetadataRetriever.METADATA_KEY_VIDEO_ROTATION)?.toIntOrNull() ?: 0
                      dur = mmr.extractMetadata(MediaMetadataRetriever.METADATA_KEY_DURATION)?.toLongOrNull() ?: 0L
                  } catch (_: Exception) {
                  } finally {
                      try { mmr.release() } catch (_: Exception) {}
                  }
                  if (rot == 90 || rot == 270) { val t = w; w = h; h = t }

                  var hasAudio = false; var aBit = 128_000; var sr = 0; var ch = 0
                  var vMime: String? = null; var aMime: String? = null; var fps = 0f
                  val ex = MediaExtractor()
                  try {
                      ex.setDataSource(ctx, uri, null)
                      for (i in 0 until ex.trackCount) {
                          val f = ex.getTrackFormat(i)
                          val mime = f.getString(MediaFormat.KEY_MIME) ?: continue
                          if (mime.startsWith("audio/")) {
                              hasAudio = true; aMime = mime
                              if (f.containsKey(MediaFormat.KEY_BIT_RATE)) aBit = f.getInteger(MediaFormat.KEY_BIT_RATE)
                              if (f.containsKey(MediaFormat.KEY_SAMPLE_RATE)) sr = f.getInteger(MediaFormat.KEY_SAMPLE_RATE)
                              if (f.containsKey(MediaFormat.KEY_CHANNEL_COUNT)) ch = f.getInteger(MediaFormat.KEY_CHANNEL_COUNT)
                          } else if (mime.startsWith("video/")) {
                              vMime = mime
                              if (f.containsKey(MediaFormat.KEY_FRAME_RATE)) {
                                  fps = try { f.getInteger(MediaFormat.KEY_FRAME_RATE).toFloat() }
                                  catch (_: Exception) { try { f.getFloat(MediaFormat.KEY_FRAME_RATE) } catch (_: Exception) { 0f } }
                              }
                          }
                      }
                  } catch (_: Exception) {
                  } finally {
                      ex.release()
                  }
                  return VInfo(uri, name, size, w, h, dur, rot, hasAudio, aBit, sr, ch, vMime, aMime, fps)
              }

              fun frameAt(ctx: Context, uri: Uri, timeUs: Long, maxSide: Int = 0): Bitmap? {
                  val mmr = MediaMetadataRetriever()
                  return try {
                      mmr.setDataSource(ctx, uri)
                      val b = mmr.getFrameAtTime(timeUs, MediaMetadataRetriever.OPTION_CLOSEST_SYNC) ?: return null
                      if (maxSide > 0 && maxOf(b.width, b.height) > maxSide) {
                          val s = maxSide.toFloat() / maxOf(b.width, b.height)
                          Bitmap.createScaledBitmap(b, (b.width * s).toInt(), (b.height * s).toInt(), true)
                      } else b
                  } catch (_: Exception) {
                      null
                  } finally {
                      try { mmr.release() } catch (_: Exception) {}
                  }
              }

              /** نوع الملف الناتج */
              enum class Kind(val mime: String, val relDir: String) {
                  VIDEO("video/mp4", Environment.DIRECTORY_MOVIES),
                  AUDIO("audio/mp4", Environment.DIRECTORY_MUSIC),
                  GIF("image/gif", Environment.DIRECTORY_PICTURES),
                  IMAGE("image/jpeg", Environment.DIRECTORY_PICTURES),
              }

              /** يحفظ الملف في المعرض/الذاكرة ويضيفه إلى "إبداعاتي" ويُرجع رابطاً قابلاً للمشاركة */
              fun save(ctx: Context, file: File, kind: Kind): Uri {
                  var uri: Uri? = null
                  if (Build.VERSION.SDK_INT >= 29) {
                      try {
                          val collection = when (kind) {
                              Kind.VIDEO -> MediaStore.Video.Media.EXTERNAL_CONTENT_URI
                              Kind.AUDIO -> MediaStore.Audio.Media.EXTERNAL_CONTENT_URI
                              else -> MediaStore.Images.Media.EXTERNAL_CONTENT_URI
                          }
                          val values = ContentValues().apply {
                              put(MediaStore.MediaColumns.DISPLAY_NAME, file.name)
                              put(MediaStore.MediaColumns.MIME_TYPE, kind.mime)
                              put(MediaStore.MediaColumns.RELATIVE_PATH, kind.relDir + "/VideoToolkit")
                              put(MediaStore.MediaColumns.IS_PENDING, 1)
                          }
                          val u = ctx.contentResolver.insert(collection, values)
                          if (u != null) {
                              ctx.contentResolver.openOutputStream(u)?.use { out ->
                                  FileInputStream(file).use { it.copyTo(out) }
                              }
                              ctx.contentResolver.update(u, ContentValues().apply {
                                  put(MediaStore.MediaColumns.IS_PENDING, 0)
                              }, null, null)
                              uri = u
                          }
                      } catch (_: Exception) {
                          uri = null
                      }
                  }
                  if (uri == null) {
                      // أندرويد 9 وما قبله أو فشل الحفظ: نحتفظ بنسخة داخل مجلد التطبيق
                      val dir = File(ctx.getExternalFilesDir(kind.relDir) ?: ctx.filesDir, "VideoToolkit").apply { mkdirs() }
                      val dest = File(dir, file.name)
                      file.copyTo(dest, overwrite = true)
                      uri = FileProvider.getUriForFile(ctx, ctx.packageName + ".fileprovider", dest)
                  }
                  Creations.add(ctx, uri!!, file.name, file.length(), kind)
                  return uri!!
              }

              fun share(ctx: Context, uri: Uri, mime: String) {
                  val send = Intent(Intent.ACTION_SEND).apply {
                      type = mime
                      putExtra(Intent.EXTRA_STREAM, uri)
                      addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                  }
                  ctx.startActivity(Intent.createChooser(send, tr("مشاركة عبر", "Share via")))
              }

              fun open(ctx: Context, uri: Uri, mime: String) {
                  try {
                      ctx.startActivity(Intent(Intent.ACTION_VIEW).apply {
                          setDataAndType(uri, mime)
                          addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                      })
                  } catch (_: Exception) {
                      share(ctx, uri, mime)
                  }
              }
          }

          /** سجل "إبداعاتي" */
          object Creations {
              data class Item(val uri: Uri, val name: String, val size: Long, val kind: Media.Kind, val time: Long)

              private fun prefs(ctx: Context) = ctx.getSharedPreferences("creations", Context.MODE_PRIVATE)

              fun all(ctx: Context): List<Item> {
                  val arr = try { JSONArray(prefs(ctx).getString("items", "[]")) } catch (_: Exception) { JSONArray() }
                  val list = mutableListOf<Item>()
                  for (i in 0 until arr.length()) {
                      val o = arr.getJSONObject(i)
                      val kind = try { Media.Kind.valueOf(o.getString("kind")) } catch (_: Exception) { Media.Kind.VIDEO }
                      list += Item(Uri.parse(o.getString("uri")), o.getString("name"), o.getLong("size"), kind, o.getLong("time"))
                  }
                  return list.sortedByDescending { it.time }
              }

              fun add(ctx: Context, uri: Uri, name: String, size: Long, kind: Media.Kind) {
                  val arr = try { JSONArray(prefs(ctx).getString("items", "[]")) } catch (_: Exception) { JSONArray() }
                  arr.put(JSONObject().apply {
                      put("uri", uri.toString()); put("name", name); put("size", size)
                      put("kind", kind.name); put("time", System.currentTimeMillis())
                  })
                  prefs(ctx).edit().putString("items", arr.toString()).apply()
              }

              fun remove(ctx: Context, item: Item) {
                  val keep = JSONArray()
                  all(ctx).filter { it.uri != item.uri }.forEach {
                      keep.put(JSONObject().apply {
                          put("uri", it.uri.toString()); put("name", it.name); put("size", it.size)
                          put("kind", it.kind.name); put("time", it.time)
                      })
                  }
                  prefs(ctx).edit().putString("items", keep.toString()).apply()
              }
          }
