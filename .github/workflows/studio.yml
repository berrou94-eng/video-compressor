                      visibility = View.GONE
                      background = round(C.CARD, 20f, 1, Color.parseColor("#3322D3EE"))
                  }
                  root.addView(result, lp(top = 14, bottom = 30))

                  setContentView(scroll)
              }

              private fun actionText() = when (tool) {
                  Tool.COMPRESS, Tool.TARGET -> tr("ابدأ الضغط  ›", "Compress  ›")
                  Tool.AUDIO -> tr("استخراج الصوت  ›", "Extract Audio  ›")
                  Tool.GIF -> tr("إنشاء GIF  ›", "Create GIF  ›")
                  Tool.FRAME -> tr("التقاط الصورة  ›", "Save Photo  ›")
                  Tool.CONVERT -> tr("تحويل  ›", "Convert  ›")
                  else -> tr("حفظ  ›", "Save  ›")
              }

              private fun progressText(p: Int) = tr("جارٍ المعالجة… ", "Processing… ") + "$p%" +
                      if (attempt > 1) tr("\n(محاولة $attempt بإعدادات أقوى)", "\n(attempt $attempt, stronger settings)") else ""

              private fun section(text: String) = label(text, 16f, C.TEXT, true).also { options.addView(it, lp(top = 18, bottom = 8)) }

              private fun note(text: String) = label(text, 13f, C.SUB).also { options.addView(it, lp(top = 8)) }

              private fun chips(labels: List<String>, selected: Int, onSelect: (Int) -> Unit): ChipGroup {
                  val group = ChipGroup(this).apply {
                      isSingleSelection = true
                      isSelectionRequired = true
                  }
                  val bg = ColorStateList(arrayOf(intArrayOf(android.R.attr.state_checked), intArrayOf()), intArrayOf(C.CYAN, C.CARD2))
                  val fg = ColorStateList(arrayOf(intArrayOf(android.R.attr.state_checked), intArrayOf()), intArrayOf(C.DARK_TEXT, C.TEXT))
                  val ids = labels.map { s ->
                      val chip = Chip(this).apply {
                          id = View.generateViewId()
                          text = s
                          isCheckable = true
                          isCheckedIconVisible = false
                          chipBackgroundColor = bg
                          setTextColor(fg)
                          chipStrokeWidth = 0f
                      }
                      group.addView(chip)
                      chip.id
                  }
                  group.check(ids[selected.coerceIn(0, ids.size - 1)])
                  group.setOnCheckedStateChangeListener { _, checked ->
                      val i = ids.indexOf(checked.firstOrNull() ?: -1)
                      if (i >= 0) onSelect(i)
                  }
                  options.addView(group, lp())
                  return group
              }

              private fun slider(from: Float, to: Float, step: Float, value: Float, fmt: (Float) -> String,
                                 onChange: (Float) -> Unit): Slider {
                  val s = Slider(this).apply {
                      valueFrom = from
                      valueTo = to
                      stepSize = step
                      this.value = value.coerceIn(from, to)
                      setLabelFormatter { v -> fmt(v) }
                      trackActiveTintList = ColorStateList.valueOf(C.CYAN)
                      thumbTintList = ColorStateList.valueOf(C.CYAN)
                      addOnChangeListener { _, v, _ -> onChange(v) }
                  }
                  options.addView(s, lp())
                  return s
              }

              private fun switch(text: String, checked: Boolean, onChange: (Boolean) -> Unit) {
                  val sw = MaterialSwitch(this).apply {
                      this.text = text
                      textSize = 15f
                      setTextColor(C.TEXT)
                      isChecked = checked
                      setOnCheckedChangeListener { _, b -> onChange(b) }
                  }
                  options.addView(sw, lp(top = 6))
              }

              /** نطاق زمني (بداية/نهاية) مع عرض الأوقات */
              private fun rangeSelector(v: VInfo, maxSpan: Float = 0f) {
                  val dur = max(v.durationSec, 0.5f)
                  rangeStart = 0f
                  rangeEnd = if (maxSpan > 0f) min(dur, maxSpan) else dur
                  val times = label("", 15f, C.CYAN, true).apply { gravity = Gravity.CENTER }
                  fun refresh() {
                      times.text = tr("البداية ", "Start ") + formatTime(rangeStart) + "     " +
                              tr("النهاية ", "End ") + formatTime(rangeEnd) + "     " +
                              tr("المدة ", "Length ") + formatTime(rangeEnd - rangeStart)
                  }
                  val rs = RangeSlider(this).apply {
                      valueFrom = 0f
                      valueTo = dur
                      values = listOf(rangeStart, rangeEnd)
                      setLabelFormatter { formatTime(it) }
                      trackActiveTintList = ColorStateList.valueOf(C.CYAN)
                      thumbTintList = ColorStateList.valueOf(C.CYAN)
                      addOnChangeListener { s, _, _ ->
                          rangeStart = s.values[0]
                          rangeEnd = s.values[1]
                          refresh()
                      }
                  }
                  options.addView(rs, lp())
                  options.addView(times, lp(top = 2))
                  refresh()
              }

              private fun optionCard(title: String, sub: String, index: Int): LinearLayout {
                  val card = vbox(14).apply {
                      isClickable = true
                      addView(label(title, 16f, C.TEXT, true))
                      addView(label(sub, 13f, C.SUB), lp(top = 2))
                      setOnClickListener {
                          preset = index
                          stylePresetCards()
                      }
                  }
                  presetCards += card
                  options.addView(card, lp(bottom = 10))
                  return card
              }

              private fun stylePresetCards() {
                  presetCards.forEachIndexed { i, c ->
                      c.background = clickable(if (i == preset) round(C.CARD, 16f, 2, C.CYAN) else round(C.CARD, 16f))
                  }
              }

              private fun resText(v: VInfo, scale: Double): String {
                  val w = ((v.width * scale).toInt() / 2) * 2
                  val h = ((v.height * scale).toInt() / 2) * 2
                  return "${w}×${h}"
              }

              // =================================================================== اختيار الفيديو

              private fun onPicked(uri: Uri) {
                  if (busy) return
                  result.visibility = View.GONE
                  status.text = tr("جارٍ قراءة الفيديو…", "Reading video…")
                  Thread {
                      val v = Media.probe(this, uri)
                      val bmp = Media.frameAt(this, uri, min(1_000_000L, v.durationMs * 500), 720)
                      runOnUiThread {
                          info = v
                          status.text = ""
                          pickCard.visibility = View.GONE
                          preview.visibility = View.VISIBLE
                          if (bmp != null) thumb.setImageBitmap(bmp) else thumb.setImageDrawable(null)
                          overlay.text = formatSize(v.size) + tr(" (الأصل)", " (original)") + "\n" +
                                  "${v.width}×${v.height}  •  " + formatTime(v.durationSec)
                          nameView.text = v.name
                          buildOptions(v)
                      }
                  }.start()
              }

              private fun buildOptions(v: VInfo) {
                  options.removeAllViews()
                  presetCards.clear()
                  actionBtn.visibility = View.VISIBLE
                  actionBtn.text = actionText()
                  when (tool) {
                      Tool.COMPRESS -> {
                          section(tr("اختر حجم الملف", "Choose output size"))
                          optionCard(tr("ملف صغير (ضغط ~80%)", "Small file (~80% smaller)"),
                              tr("دقة منخفضة ", "Low resolution ") + "(${resText(v, 0.5)})", 0)
                          optionCard(tr("ملف متوسط (ضغط ~65%)", "Medium file (~65% smaller)"),
                              tr("دقة متوسطة ", "Medium resolution ") + "(${resText(v, 0.75)})", 1)
                          optionCard(tr("ملف كبير (ضغط ~50%)", "Large file (~50% smaller)"),
                              tr("الدقة الأصلية ", "Original resolution ") + "(${resText(v, 1.0)})", 2)
                          optionCard(tr("دقة مخصصة", "Custom resolution"),
                              tr("اختر نسبة الدقة بالشريط أدناه", "Pick the resolution with the slider"), 3)
                          stylePresetCards()
                          val resLabel = label("", 14f, C.CYAN, true)
                          fun refresh() {
                              resLabel.text = tr("الدقة: ", "Resolution: ") + resText(v, customScale / 100.0) + "   $customScale%"
                          }
                          options.addView(resLabel, lp(top = 4))
                          slider(25f, 100f, 5f, customScale.toFloat(), { "${it.toInt()}%" }) {
                              customScale = it.toInt(); preset = 3; stylePresetCards(); refresh()
                          }
                          refresh()
                          switch(tr("ترميز H.265 (حجم أصغر بنحو 30%)", "H.265 codec (~30% smaller)"), hevc) { hevc = it }
                          note(tr("يحسب التطبيق معدل البت من حجم الفيديو الأصلي، ويعيد الضغط تلقائياً إذا لم يبلغ الهدف.",
                              "Bitrate is computed from the original size; it retries automatically if the target isn't reached."))
                      }
                      Tool.TARGET -> {
                          section(tr("الحجم المطلوب", "Target size"))
                          val sizes = listOf(8, 16, 25, 50, 100)
                          val labels = sizes.map { if (it == 16) tr("16MB (واتساب)", "16MB (WhatsApp)") else "${it}MB" }
                          chips(labels, sizes.indexOf(targetMb).coerceAtLeast(0)) { targetMb = sizes[it] }
                          switch(tr("ترميز H.265 (جودة أفضل لنفس الحجم)", "H.265 codec (better quality per MB)"), hevc) { hevc = it }
                          note(tr("الحجم الحالي: ", "Current size: ") + formatSize(v.size))
                      }
                      Tool.CONVERT -> {
                          section(tr("الترميز", "Codec"))
                          chips(listOf(tr("H.264 (متوافق مع الكل)", "H.264 (most compatible)"),
                              tr("H.265 / HEVC (أصغر)", "H.265 / HEVC (smaller)")), if (hevc) 1 else 0) { hevc = it == 1 }
                          section(tr("الجودة", "Quality"))
                          chips(listOf(tr("عالية", "High"), tr("متوسطة", "Medium")), quality) { quality = it }
                          note(tr("الصيغة الناتجة MP4. صيغ AVI وMKV وFLV تحتاج مكتبة FFmpeg غير مدعومة في هذا الإصدار.",
                              "Output is MP4. AVI/MKV/FLV need FFmpeg, which this version doesn't include."))
                      }
                      Tool.AUDIO -> {
                          if (!v.hasAudio) note(tr("⚠️ هذا الفيديو لا يحتوي على صوت.", "⚠️ This video has no audio track."))
                          section(tr("جودة الصوت", "Bitrate"))
                          val rates = listOf(64, 96, 128, 192, 256)
                          chips(rates.map { "${it}kb/s" }, rates.indexOf(audioKbps)) { audioKbps = rates[it] }
                          note(tr("الصيغة الناتجة M4A (AAC) وتعمل في كل المشغلات. ترميز MP3 غير متوفر في أندرويد دون مكتبات إضافية.",
                              "Output is M4A (AAC), playable everywhere. MP3 encoding isn't built into Android."))
                      }
                      Tool.GIF -> {
                          section(tr("اختر المقطع (حتى 15 ثانية)", "Pick the clip (up to 15 s)"))
                          rangeSelector(v, 5f)
                          section(tr("العرض", "Width"))
                          val widths = listOf(240, 320, 480)
                          chips(widths.map { "${it}px" }, widths.indexOf(gifWidth)) { gifWidth = widths[it] }
                          section(tr("الإطارات في الثانية", "Frames per second"))
                          val fpsList = listOf(8, 10, 15)
                          chips(fpsList.map { "$it fps" }, fpsList.indexOf(gifFps)) { gifFps = fpsList[it] }
                      }
                      Tool.FRAME -> {
                          section(tr("اختر اللحظة", "Pick the moment"))
                          val dur = max(v.durationSec, 0.5f)
                          val t = label(formatTime(0f), 15f, C.CYAN, true).apply { gravity = Gravity.CENTER }
                          val s = slider(0f, dur, 0f, 0f, { formatTime(it) }) { frameSec = it; t.text = formatTime(it) }
                          s.addOnSliderTouchListener(object : Slider.OnSliderTouchListener {
                              override fun onStartTrackingTouch(slider: Slider) {}
                              override fun onStopTrackingTouch(slider: Slider) { updateThumb((frameSec * 1_000_000).toLong()) }
                          })
                          options.addView(t, lp())
                      }
                      Tool.TRIM -> {
                          section(tr("حدّد البداية والنهاية", "Set start and end"))
                          rangeSelector(v)
                      }
                      Tool.CROP -> {
                          section(tr("نسبة الأبعاد", "Aspect ratio"))
                          chips(listOf("1:1", "4:5", "9:16", "16:9", "4:3", "3:4"), cropIndex) { cropIndex = it }
                          note(tr("يُقتص الفيديو من المنتصف. مثالي لإنستغرام وتيك توك ويوتيوب شورتس.",
                              "Center crop — great for Instagram, TikTok and Shorts."))
                      }
                      Tool.SLOW, Tool.FAST -> {
                          section(tr("السرعة", "Speed"))
                          val list = if (tool == Tool.SLOW) listOf(0.25f, 0.5f, 0.75f) else listOf(1.5f, 2f, 3f, 4f)
                          chips(list.map { "${trimZero(it)}×" }, list.indexOf(speed).coerceAtLeast(0)) { speed = list[it] }
                          chips(listOf(tr("مع الصوت", "With audio"), tr("بدون صوت", "Without audio")), if (keepAudio) 0 else 1) {
                              keepAudio = it == 0
                          }
                      }
                      Tool.ROTATE -> {
                          section(tr("التدوير", "Rotation"))
                          val rots = listOf(0, 90, 180, 270)
                          chips(rots.map { if (it == 0) tr("بدون", "None") else "$it°" }, rots.indexOf(rotation)) { rotation = rots[it] }
                          section(tr("القلب", "Flip"))
                          switch(tr("قلب أفقي (مرآة)", "Flip horizontally (mirror)"), flipH) { flipH = it }
                          switch(tr("قلب عمودي", "Flip vertically"), flipV) { flipV = it }
                      }
                      Tool.MUTE -> {
                          note(tr("سيُحذف الصوت بالكامل دون إعادة ترميز الصورة، فتبقى الجودة كما هي.",
                              "Audio is removed without re-encoding the picture, so quality stays the same."))
                      }
                      Tool.LOOP -> {
                          section(tr("عدد مرات التكرار", "Number of loops"))
                          val l = label("", 15f, C.CYAN, true)
                          fun refresh() { l.text = "$loops× = " + formatTime(v.durationSec * loops) }
                          options.addView(l, lp())
                          slider(2f, 10f, 1f, loops.toFloat(), { "${it.toInt()}×" }) { loops = it.toInt(); refresh() }
                          refresh()
                      }
                      Tool.VOLUME -> {
                          if (!v.hasAudio) note(tr("⚠️ هذا الفيديو لا يحتوي على صوت.", "⚠️ This video has no audio track."))
                          section(tr("مستوى الصوت", "Volume"))
                          val l = label("", 15f, C.CYAN, true)
                          fun refresh() { l.text = "$volume%" }
                          options.addView(l, lp())
                          slider(0f, 300f, 10f, volume.toFloat(), { "${it.toInt()}%" }) { volume = it.toInt(); refresh() }
                          refresh()
                          note(tr("فوق 200% قد يظهر تشويش في الأصوات العالية.", "Above 200% loud parts may distort."))
                      }
                      Tool.INFO -> {
                          actionBtn.visibility = View.GONE
                          showInfo(v)
                      }
                  }
              }

              private fun trimZero(f: Float) = if (f == f.toInt().toFloat()) f.toInt().toString() else f.toString()

              private fun updateThumb(us: Long) {
                  val v = info ?: return
                  Thread {
                      val b = Media.frameAt(this, v.uri, us, 720)
                      runOnUiThread { if (b != null) thumb.setImageBitmap(b) }
                  }.start()
              }

              private fun showInfo(v: VInfo) {
                  val rows = listOf(
                      tr("الاسم", "Name") to v.name,
                      tr("الحجم", "Size") to formatSize(v.size),
                      tr("الدقة", "Resolution") to "${v.width}×${v.height}",
                      tr("المدة", "Duration") to formatTime(v.durationSec),
                      tr("معدل البت", "Bitrate") to "${v.totalBitrate / 1000} kbps",
                      tr("الإطارات/ث", "Frame rate") to if (v.fps > 0) "${v.fps.roundToInt()} fps" else "—",
                      tr("ترميز الفيديو", "Video codec") to (v.videoMime ?: "—"),
                      tr("الدوران", "Rotation") to "${v.rotation}°",
                      tr("ترميز الصوت", "Audio codec") to (v.audioMime ?: tr("لا يوجد", "none")),
                      tr("الصوت", "Audio") to if (v.hasAudio) "${v.sampleRate} Hz • ${v.channels}ch • ${v.audioBitrate / 1000} kbps" else "—",
                  )
                  val card = vbox(14).apply { background = round(C.CARD, 18f) }
                  rows.forEach { (k, value) ->
                      val r = hbox()
                      r.addView(label(k, 14f, C.SUB), lp(w = 0, weight = 1f))
                      r.addView(label(value, 14f, C.TEXT, true).apply { gravity = Gravity.END }, lp(w = 0, weight = 1.6f))
                      card.addView(r, lp(bottom = 10))
                  }
                  options.addView(card, lp(top = 12))
              }

              // =================================================================== المعالجة

              private fun process() {
                  val v = info ?: run { picker.launch("video/*"); return }
                  if (busy) return
                  result.visibility = View.GONE
                  attempt = 0
                  when (tool) {
                      Tool.COMPRESS, Tool.TARGET -> startCompress(v)
                      Tool.GIF -> makeGif(v)
                      Tool.FRAME -> grabFrame(v)
                      Tool.INFO -> {}
                      else -> startSimple(v)
                  }
              }

              private fun setBusy(b: Boolean) {
                  busy = b
                  actionBtn.isEnabled = !b
                  actionBtn.alpha = if (b) 0.5f else 1f
                  progress.visibility = if (b) View.VISIBLE else View.GONE
                  if (b) {
                      progress.isIndeterminate = true
                      status.text = progressText(0)
                  }
              }

              private fun outFile(ext: String): File {
                  val dir = File(cacheDir, "out").apply { mkdirs() }
                  dir.listFiles()?.forEach { if (System.currentTimeMillis() - it.lastModified() > 60_000) it.delete() }
                  val stamp = SimpleDateFormat("yyyyMMdd_HHmmss", Locale.US).format(Date())
                  return File(dir, "VT_${tool.name.lowercase(Locale.US)}_$stamp.$ext")
              }

              private fun mediaItem(v: VInfo, startMs: Long = -1, endMs: Long = -1): MediaItem {
                  val b = MediaItem.Builder().setUri(v.uri)
                  if (startMs >= 0 && endMs > startMs) {
                      b.setClippingConfiguration(
                          MediaItem.ClippingConfiguration.Builder()
                              .setStartPositionMs(startMs)
                              .setEndPositionMs(endMs)
                              .build()
                      )
                  }
                  return b.build()
              }

              private fun sourceVideoBitrate(v: VInfo): Int {
                  val audio = if (v.hasAudio) v.audioBitrate else 0
                  return (v.totalBitrate - audio).toInt().coerceAtLeast(300_000)
              }

              /** الأدوات البسيطة: تحويل، صوت، قص، اقتصاص، سرعة، تدوير، كتم، تكرار، مستوى الصوت */
              private fun startSimple(v: VInfo) {
                  val videoFx = mutableListOf<Effect>()
                  val audioFx = mutableListOf<AudioProcessor>()
                  var removeAudio = false
                  var removeVideo = false
                  var startMs = -1L
                  var endMs = -1L
                  var repeat = 1
                  var videoMime: String? = MimeTypes.VIDEO_H264
                  var vBitrate = sourceVideoBitrate(v)
                  var aBitrate = 0
                  var ext = "mp4"

                  when (tool) {
                      Tool.CONVERT -> {
                          videoMime = if (hevc) MimeTypes.VIDEO_H265 else MimeTypes.VIDEO_H264
                          val q = if (quality == 0) 0.9 else 0.55
                          vBitrate = (vBitrate * q * (if (hevc) 0.7 else 1.0)).toInt()
                      }
                      Tool.AUDIO -> {
                          if (!v.hasAudio) { fail(tr("هذا الفيديو لا يحتوي على صوت.", "This video has no audio.")); return }
                          removeVideo = true; videoMime = null; vBitrate = 0
                          aBitrate = audioKbps * 1000; ext = "m4a"
                      }
                      Tool.TRIM -> {
                          startMs = (rangeStart * 1000).toLong(); endMs = (rangeEnd * 1000).toLong()
                          videoMime = null
                      }
                      Tool.CROP -> {
                          val ratios = listOf(1f, 4f / 5f, 9f / 16f, 16f / 9f, 4f / 3f, 3f / 4f)
                          val target = ratios[cropIndex]
                          val input = if (v.height > 0) v.width.toFloat() / v.height else 1f
                          val crop = if (input > target) {
                              val half = target / input
                              Crop(-half, half, -1f, 1f)
                          } else {
                              val half = input / target
                              Crop(-1f, 1f, -half, half)
                          }
                          videoFx += crop
                      }
                      Tool.SLOW, Tool.FAST -> {
                          videoFx += SpeedChangeEffect(speed)
                          if (keepAudio && v.hasAudio) {
                              audioFx += SonicAudioProcessor().apply { setSpeed(speed); setPitch(1f) }
                          } else removeAudio = true
                          if (tool == Tool.FAST) vBitrate = (vBitrate * 1.2).toInt()
                      }
                      Tool.ROTATE -> {
                          if (rotation == 0 && !flipH && !flipV) { fail(tr("اختر تدويراً أو قلباً أولاً.", "Choose a rotation or flip first.")); return }
                          videoFx += ScaleAndRotateTransformation.Builder()
                              .setScale(if (flipH) -1f else 1f, if (flipV) -1f else 1f)
                              .setRotationDegrees((360 - rotation).toFloat() % 360f)
                              .build()
                      }
                      Tool.MUTE -> {
                          if (!v.hasAudio) { fail(tr("هذا الفيديو بلا صوت أصلاً.", "This video is already silent.")); return }
                          removeAudio = true; videoMime = null
                      }
                      Tool.LOOP -> {
                          repeat = loops; videoMime = null
                      }
                      Tool.VOLUME -> {
                          if (!v.hasAudio) { fail(tr("هذا الفيديو لا يحتوي على صوت.", "This video has no audio.")); return }
                          val g = volume / 100f
                          audioFx += ChannelMixingAudioProcessor().apply {
                              putChannelMixingMatrix(ChannelMixingMatrix.create(1, 1).scaleBy(g))
                              putChannelMixingMatrix(ChannelMixingMatrix.create(2, 2).scaleBy(g))
                          }
                          videoMime = null
                          aBitrate = max(v.audioBitrate, 96_000)
                      }
                      else -> {}
                  }

                  val edited = EditedMediaItem.Builder(mediaItem(v, startMs, endMs))
                      .setRemoveAudio(removeAudio)
                      .setRemoveVideo(removeVideo)
                      .setEffects(Effects(audioFx, videoFx))
                      .build()
                  val items = List(repeat) { edited }
                  setBusy(true)
                  exporter.start(items, outFile(ext), videoMime, vBitrate, aBitrate)
              }

              // ---- الضغط مع إعادة المحاولة
              private fun startCompress(v: VInfo) {
                  var scale = 1.0
                  val fraction: Double
                  if (tool == Tool.TARGET) {
                      targetBytes = targetMb * 1024L * 1024L
                      if (v.size in 1..targetBytes) {
                          showResultOriginal(v, tr("حجم الفيديو (${formatSize(v.size)}) أصغر من ${targetMb}MB أصلاً — يمكنك إرساله كما هو.",
                              "The video (${formatSize(v.size)}) is already under ${targetMb}MB — send it as is."))
                          return
                      }
                  } else {
                      when (preset) {
                          0 -> { fraction = 0.20; scale = 0.5 }
                          1 -> { fraction = 0.35; scale = 0.75 }
                          2 -> { fraction = 0.50; scale = 1.0 }
                          else -> { scale = customScale / 100.0; fraction = (0.5 * scale * scale + 0.05).coerceIn(0.12, 0.5) }
                      }
                      targetBytes = if (v.size > 0) (v.size * fraction).toLong() else 0L
                  }

                  if (targetBytes > 0 && v.durationMs > 0) {
                      val total = targetBytes * 8.0 * 1000.0 / v.durationMs * 0.95
                      curAudioBitrate = when {
                          !v.hasAudio -> 0
                          total < 350_000 -> 48_000
                          total < 900_000 -> 64_000
                          else -> 96_000
                      }
                      curVideoBitrate = max(60_000, (total - curAudioBitrate).toInt())
                  } else {
                      curAudioBitrate = 96_000
                      curVideoBitrate = when (preset) { 0 -> 500_000; 1 -> 900_000; else -> 1_500_000 }
                  }
                  if (hevc) curVideoBitrate = (curVideoBitrate * 0.9).toInt()
                  val byScale = ((v.shortSide * scale).toInt() / 2) * 2
                  curShort = min(Exporter.shortSideFor(curVideoBitrate), if (byScale > 0) byScale else 720).coerceAtLeast(144)
                  runCompress(v)
              }

              private fun runCompress(v: VInfo) {
                  attempt++
                  val fx = mutableListOf<Effect>()
                  val th = Exporter.targetHeight(v.width, v.height, curShort)
                  if (th > 0) fx += Presentation.createForHeight(th)
                  val edited = EditedMediaItem.Builder(mediaItem(v))
                      .setEffects(Effects(emptyList(), fx))
                      .build()
                  setBusy(true)
                  exporter.start(listOf(edited), outFile("mp4"),
                      if (hevc) MimeTypes.VIDEO_H265 else MimeTypes.VIDEO_H264, curVideoBitrate, curAudioBitrate)
              }

              private fun onExportDone(f: File) {
                  val v = info ?: return
                  if (tool == Tool.COMPRESS || tool == Tool.TARGET) {
                      val size = f.length()
                      if (targetBytes > 0 && size > targetBytes * 1.08 && attempt < 3) {
                          val ratio = (targetBytes.toDouble() / size).coerceIn(0.3, 0.92)
                          curVideoBitrate = max(50_000, (curVideoBitrate * ratio * 0.92).toInt())
                          curShort = max(144, min(curShort, Exporter.shortSideFor(curVideoBitrate)) - 90)
                          curShort -= curShort % 2
                          f.delete()
                          runCompress(v)
                          return
                      }
                      if (v.size in 1..size) {
                          f.delete()
                          setBusy(false)
                          status.text = ""
                          showResultOriginal(v, tr("هذا الفيديو مضغوط أصلاً ولا يمكن تصغيره أكثر دون إفساده.",
                              "This video is already highly compressed and can't get smaller without ruining it."))
                          return
                      }
                  }
                  val kind = if (tool == Tool.AUDIO) Media.Kind.AUDIO else Media.Kind.VIDEO
                  finishWith(f, kind)
              }

              private fun fail(msg: String) {
                  setBusy(false)
                  status.text = "❌ " + tr("تعذّرت المعالجة:\n", "Failed:\n") + msg
              }

              // ---- GIF
              private fun makeGif(v: VInfo) {
                  val start = rangeStart
                  val end = min(rangeEnd, start + 15f)
                  if (end - start < 0.2f) { fail(tr("المقطع قصير جداً.", "Clip too short.")); return }
                  val fps = gifFps
                  val w = min(gifWidth, max(v.width, 2)).let { it - it % 2 }
                  val h = (if (v.width > 0) (v.height.toLong() * w / v.width).toInt() else w).let { max(2, it - it % 2) }
                  val out = outFile("gif")
                  setBusy(true)
                  Thread {
                      val mmr = MediaMetadataRetriever()
                      try {
                          mmr.setDataSource(this, v.uri)
                          val n = max(1, ((end - start) * fps).toInt())
                          val enc = GifEncoder(out, w, h, max(2, 100 / fps))
                          for (i in 0 until n) {
                              val us = ((start + i.toFloat() / fps) * 1_000_000).toLong()
                              val bmp = if (Build.VERSION.SDK_INT >= 27)
                                  mmr.getScaledFrameAtTime(us, MediaMetadataRetriever.OPTION_CLOSEST, w, h)
                              else mmr.getFrameAtTime(us, MediaMetadataRetriever.OPTION_CLOSEST)
                              if (bmp != null) {
                                  enc.addFrame(bmp)
                                  bmp.recycle()
                              }
                              val p = (i + 1) * 100 / n
                              runOnUiThread {
                                  progress.isIndeterminate = false
                                  progress.progress = p
                                  status.text = progressText(p)
                              }
                          }
                          enc.finish()
                          runOnUiThread { finishWith(out, Media.Kind.GIF) }
                      } catch (e: Exception) {
                          runOnUiThread { fail(e.localizedMessage ?: e.toString()) }
                      } finally {
                          try { mmr.release() } catch (_: Exception) {}
                      }
                  }.start()
              }

              // ---- صورة من الفيديو
              private fun grabFrame(v: VInfo) {
                  val out = outFile("jpg")
                  setBusy(true)
                  Thread {
                      val mmr = MediaMetadataRetriever()
                      try {
                          mmr.setDataSource(this, v.uri)
                          val bmp = mmr.getFrameAtTime((frameSec * 1_000_000).toLong(), MediaMetadataRetriever.OPTION_CLOSEST)
                              ?: throw IllegalStateException(tr("تعذّر قراءة الإطار", "Couldn't read the frame"))
                          FileOutputStream(out).use { bmp.compress(Bitmap.CompressFormat.JPEG, 95, it) }
                          bmp.recycle()
                          runOnUiThread { finishWith(out, Media.Kind.IMAGE) }
                      } catch (e: Exception) {
                          runOnUiThread { fail(e.localizedMessage ?: e.toString()) }
                      } finally {
                          try { mmr.release() } catch (_: Exception) {}
                      }
                  }.start()
              }

              // =================================================================== النتيجة

              private fun finishWith(f: File, kind: Media.Kind) {
                  status.text = tr("جارٍ الحفظ…", "Saving…")
                  Thread {
                      val uri = try { Media.save(this, f, kind) } catch (e: Exception) { null }
                      runOnUiThread {
                          setBusy(false)
                          status.text = ""
                          if (uri == null) { fail(tr("تعذّر حفظ الملف.", "Couldn't save the file.")); return@runOnUiThread }
                          showResult(f.length(), uri, kind)
                      }
                  }.start()
              }

              private fun showResult(outSize: Long, uri: Uri, kind: Media.Kind) {
                  val v = info
                  result.removeAllViews()
                  result.visibility = View.VISIBLE
                  result.addView(label("✅ " + tr("تم بنجاح!", "Done!"), 20f, C.TEXT, true))
                  if (v != null && v.size > 0) {
                      val pct = ((v.size - outSize) * 100 / v.size).toInt()
                      val change = if (pct > 0) tr("أصغر بنسبة $pct%", "$pct% smaller")
                      else tr("أكبر بنسبة ${-pct}%", "${-pct}% larger")
                      result.addView(label(formatSize(v.size) + "  →  " + formatSize(outSize), 18f, C.CYAN, true), lp(top = 8))
                      if (kind == Media.Kind.VIDEO || kind == Media.Kind.AUDIO) result.addView(label(change, 14f, C.SUB), lp(top = 2))
                  } else {
                      result.addView(label(formatSize(outSize), 18f, C.CYAN, true), lp(top = 8))
                  }
                  val where = when (kind) {
                      Media.Kind.VIDEO -> "Movies/VideoToolkit"
                      Media.Kind.AUDIO -> "Music/VideoToolkit"
                      else -> "Pictures/VideoToolkit"
                  }
                  result.addView(label(tr("حُفظ في: ", "Saved to: ") + where, 13f, C.SUB), lp(top = 4))
                  val row = hbox()
                  row.addView(secondaryButton(tr("📤 مشاركة", "📤 Share"), Color.parseColor("#2563EB")) {
                      Media.share(this, uri, kind.mime)
                  }, lp(w = 0, weight = 1f, end = 6))
                  row.addView(secondaryButton(tr("▶ فتح", "▶ Open")) { Media.open(this, uri, kind.mime) },
                      lp(w = 0, weight = 1f, start = 6))
                  result.addView(row, lp(top = 14))
              }

              private fun showResultOriginal(v: VInfo, message: String) {
                  result.removeAllViews()
                  result.visibility = View.VISIBLE
                  result.addView(label("ℹ️ " + message, 15f, C.TEXT))
                  result.addView(secondaryButton(tr("📤 إرسال الأصلي (", "📤 Send original (") + formatSize(v.size) + ")",
                      Color.parseColor("#2563EB")) { Media.share(this, v.uri, "video/*") }, lp(top = 12))
              }
          }
          EOF_VC
          mkdir -p app/src/main/java/com/omar/videotoolkit
          cat > app/src/main/java/com/omar/videotoolkit/Ui.kt <<'EOF_VC'
          package com.omar.videotoolkit

          import android.content.Context
          import android.content.res.ColorStateList
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.graphics.drawable.RippleDrawable
          import android.view.Gravity
          import android.view.View
          import android.view.ViewGroup
          import android.widget.LinearLayout
          import android.widget.TextView
          import kotlin.math.roundToInt

          /** ألوان الواجهة الداكنة */
          object C {
              val BG = Color.parseColor("#111217")
              val CARD = Color.parseColor("#1E2027")
              val CARD2 = Color.parseColor("#2A2D36")
              val CYAN = Color.parseColor("#22D3EE")
              val PURPLE = Color.parseColor("#A855F7")
              val PINK = Color.parseColor("#EC4899")
              val ORANGE = Color.parseColor("#F59E0B")
              val TEXT = Color.WHITE
              val SUB = Color.parseColor("#9CA3AF")
              val DARK_TEXT = Color.parseColor("#04121A")
          }

          /** اللغة: عربية افتراضياً */
          object Lang {
              var ar = true
              fun load(ctx: Context) {
                  ar = ctx.getSharedPreferences("settings", Context.MODE_PRIVATE).getString("lang", "ar") == "ar"
              }
              fun set(ctx: Context, arabic: Boolean) {
                  ar = arabic
                  ctx.getSharedPreferences("settings", Context.MODE_PRIVATE).edit()
                      .putString("lang", if (arabic) "ar" else "en").apply()
              }
              val dir get() = if (ar) View.LAYOUT_DIRECTION_RTL else View.LAYOUT_DIRECTION_LTR
          }

          fun tr(ar: String, en: String) = if (Lang.ar) ar else en

          fun Context.dp(v: Int) = (v * resources.displayMetrics.density).roundToInt()
          fun Context.dpf(v: Float) = v * resources.displayMetrics.density

          fun Context.round(color: Int, radiusDp: Float, strokeDp: Int = 0, strokeColor: Int = 0) =
              GradientDrawable().apply {
                  setColor(color)
                  cornerRadius = dpf(radiusDp)
                  if (strokeDp > 0) setStroke(dp(strokeDp), strokeColor)
              }

          fun Context.gradient(colors: IntArray, radiusDp: Float,
                               orientation: GradientDrawable.Orientation = GradientDrawable.Orientation.TL_BR) =
              GradientDrawable(orientation, colors).apply { cornerRadius = dpf(radiusDp) }

          /** خلفية قابلة للضغط مع تأثير الموجة */
          fun Context.clickable(bg: GradientDrawable) =
              RippleDrawable(ColorStateList.valueOf(Color.parseColor("#33FFFFFF")), bg, null)

          fun Context.label(text: String, sizeSp: Float = 15f, color: Int = C.TEXT, bold: Boolean = false) =
              TextView(this).apply {
                  this.text = text
                  textSize = sizeSp
                  setTextColor(color)
                  if (bold) typeface = Typeface.DEFAULT_BOLD
              }

          fun Context.primaryButton(text: String, onClick: () -> Unit) = TextView(this).apply {
              this.text = text
              textSize = 19f
              typeface = Typeface.DEFAULT_BOLD
              setTextColor(C.DARK_TEXT)
              gravity = Gravity.CENTER
              setPadding(dp(16), dp(16), dp(16), dp(16))
              background = clickable(round(C.CYAN, 18f))
              isClickable = true
              setOnClickListener { onClick() }
          }

          fun Context.secondaryButton(text: String, color: Int = C.CARD2, onClick: () -> Unit) = TextView(this).apply {
              this.text = text
              textSize = 15f
              typeface = Typeface.DEFAULT_BOLD
              setTextColor(C.TEXT)
              gravity = Gravity.CENTER
              setPadding(dp(12), dp(13), dp(12), dp(13))
              background = clickable(round(color, 14f))
              isClickable = true
              setOnClickListener { onClick() }
          }

          fun Context.lp(w: Int = ViewGroup.LayoutParams.MATCH_PARENT, h: Int = ViewGroup.LayoutParams.WRAP_CONTENT,
                         top: Int = 0, bottom: Int = 0, start: Int = 0, end: Int = 0, weight: Float = 0f) =
              LinearLayout.LayoutParams(w, h, weight).apply {
                  topMargin = dp(top); bottomMargin = dp(bottom)
                  marginStart = dp(start); marginEnd = dp(end)
              }

          fun Context.vbox(paddingDp: Int = 0) = LinearLayout(this).apply {
              orientation = LinearLayout.VERTICAL
              setPadding(dp(paddingDp), dp(paddingDp), dp(paddingDp), dp(paddingDp))
          }

          fun Context.hbox() = LinearLayout(this).apply {
              orientation = LinearLayout.HORIZONTAL
              gravity = Gravity.CENTER_VERTICAL
          }

          fun formatSize(b: Long): String = when {
              b < 0 -> "?"
              b < 1024 -> "$b B"
              b < 1024 * 1024 -> String.format(java.util.Locale.US, "%.0f KB", b / 1024.0)
              b < 1024L * 1024 * 1024 -> String.format(java.util.Locale.US, "%.1f MB", b / 1048576.0)
              else -> String.format(java.util.Locale.US, "%.2f GB", b / 1073741824.0)
          }

          fun formatTime(sec: Float): String {
              val s = sec.toInt().coerceAtLeast(0)
              val tenth = ((sec - s) * 10).toInt().coerceIn(0, 9)
              return if (s >= 3600) String.format(java.util.Locale.US, "%d:%02d:%02d", s / 3600, s / 60 % 60, s % 60)
              else String.format(java.util.Locale.US, "%02d:%02d.%d", s / 60, s % 60, tenth)
          }
          EOF_VC
          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/ic_launcher.xml <<'EOF_VC'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:pathData="M0,0h108v108h-108z">
                  <aapt:attr xmlns:aapt="http://schemas.android.com/aapt" name="android:fillColor">
                      <gradient android:type="linear" android:startX="0" android:startY="0"
                          android:endX="108" android:endY="108"
                          android:startColor="#22D3EE" android:endColor="#A855F7" />
                  </aapt:attr>
              </path>
              <path android:fillColor="#FFFFFF" android:pathData="M28,38h38a5,5 0 0 1 5,5v22a5,5 0 0 1 -5,5h-38a5,5 0 0 1 -5,-5v-22a5,5 0 0 1 5,-5z" />
              <path android:fillColor="#FFFFFF" android:pathData="M74,47l12,-8v30l-12,-8z" />
              <path android:fillColor="#A855F7" android:pathData="M40,46l14,8l-14,8z" />
