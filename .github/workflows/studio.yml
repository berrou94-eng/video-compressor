                  <item name="android:statusBarColor">#111217</item>
                  <item name="android:navigationBarColor">#16181D</item>
              </style>
          </resources>
          EOF_VC
          mkdir -p app/src/main/res/xml
          cat > app/src/main/res/xml/file_paths.xml <<'EOF_VC'
          <?xml version="1.0" encoding="utf-8"?>
          <paths>
              <cache-path name="cache" path="." />
              <external-files-path name="external" path="." />
          </paths>
          EOF_VC
          cat > build.gradle.kts <<'EOF_VC'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF_VC
          cat > gradle.properties <<'EOF_VC'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          EOF_VC
          cat > settings.gradle.kts <<'EOF_VC'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "VideoToolkit"
          include(":app")
