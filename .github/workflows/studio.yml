name: Build Video Toolkit

on:
  push:
    paths:
      - '.github/workflows/studio.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vt
    steps:
      - name: Prepare folder
        working-directory: .
        run: mkdir -p vt

      - name: Generate project files
        run: |
          mkdir -p app
          cat > app/build.gradle.kts <<'EOF_VC'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.omar.videotoolkit"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.omar.videotoolkit"
                  minSdk = 24
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
              }
              buildTypes { release { isMinifyEnabled = false } }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              lint { abortOnError = false; checkReleaseBuilds = false }
          }

          dependencies {
              val media3 = "1.5.1"
              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("com.google.android.material:material:1.12.0")
              implementation("androidx.media3:media3-common:$media3")
              implementation("androidx.media3:media3-transformer:$media3")
              implementation("androidx.media3:media3-effect:$media3")
          }
          EOF_VC
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'EOF_VC'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission
                  android:name="android.permission.WRITE_EXTERNAL_STORAGE"
                  android:maxSdkVersion="28" />

              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <activity
                      android:name=".ToolActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.SEND" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <data android:mimeType="video/*" />
                      </intent-filter>
                  </activity>
                  <activity
                      android:name=".CreationsActivity"
                      android:exported="false"
                      android:screenOrientation="portrait" />

                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="${applicationId}.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths" />
                  </provider>
              </application>
          </manifest>
          EOF_VC
          mkdir -p app/src/main/java/com/omar/videotoolkit
          cat > app/src/main/java/com/omar/videotoolkit/CreationsActivity.kt <<'EOF_VC'
          package com.omar.videotoolkit

          import android.graphics.Color
          import android.os.Bundle
          import android.view.Gravity
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import androidx.appcompat.app.AppCompatActivity
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          class CreationsActivity : AppCompatActivity() {

              private lateinit var list: LinearLayout

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  Lang.load(this)
                  val scroll = ScrollView(this).apply { setBackgroundColor(C.BG) }
                  val root = vbox(18).apply { layoutDirection = Lang.dir }
                  scroll.addView(root)

                  val top = hbox()
                  top.addView(label(if (Lang.ar) "→" else "←", 26f, C.TEXT, true).apply {
                      setPadding(dp(4), 0, dp(14), 0)
                      setOnClickListener { finish() }
                  })
                  top.addView(label("🎬  " + tr("إبداعاتي", "My Creations"), 22f, C.TEXT, true))
                  root.addView(top, lp(bottom = 16))

                  list = vbox()
                  root.addView(list, lp())
                  setContentView(scroll)
              }

              override fun onResume() {
                  super.onResume()
                  render()
              }

              private fun render() {
                  list.removeAllViews()
                  val items = Creations.all(this)
                  if (items.isEmpty()) {
                      list.addView(label(tr("لا توجد ملفات بعد.\nكل ما تنشئه بالتطبيق سيظهر هنا.",
                          "Nothing yet.\nEverything you create will show up here."), 16f, C.SUB).apply {
                          gravity = Gravity.CENTER
                      }, lp(top = 80))
                      return
                  }
                  val fmt = SimpleDateFormat("yyyy/MM/dd HH:mm", Locale.US)
                  items.forEach { item ->
                      val icon = when (item.kind) {
                          Media.Kind.VIDEO -> "🎬"
                          Media.Kind.AUDIO -> "🎵"
                          Media.Kind.GIF -> "🎞️"
                          Media.Kind.IMAGE -> "📸"
                      }
                      val card = vbox(14).apply { background = round(C.CARD, 18f) }
                      val head = hbox()
                      head.addView(label(icon, 26f), lp(w = -2))
                      head.addView(vbox().apply {
                          addView(label(item.name, 14f, C.TEXT, true).apply { maxLines = 1 })
                          addView(label(formatSize(item.size) + "  •  " + fmt.format(Date(item.time)), 12f, C.SUB))
                      }, lp(w = 0, weight = 1f, start = 10))
                      card.addView(head, lp())
                      val row = hbox()
                      row.addView(secondaryButton(tr("▶ فتح", "▶ Open")) { Media.open(this, item.uri, item.kind.mime) },
                          lp(w = 0, weight = 1f, end = 4))
                      row.addView(secondaryButton(tr("📤 مشاركة", "📤 Share"), Color.parseColor("#2563EB")) {
                          Media.share(this, item.uri, item.kind.mime)
                      }, lp(w = 0, weight = 1f, start = 4, end = 4))
                      row.addView(secondaryButton("✕") {
                          Creations.remove(this, item); render()
                      }, lp(w = dp(52), start = 4))
                      card.addView(row, lp(top = 10))
                      list.addView(card, lp(bottom = 12))
                  }
                  list.addView(label(tr("زر ✕ يزيل الملف من القائمة فقط، ويبقى في المعرض.",
                      "✕ only removes it from this list; the file stays in your gallery."), 12f, C.SUB).apply {
                      gravity = Gravity.CENTER
                  }, lp(top = 4))
              }
          }
          EOF_VC
          mkdir -p app/src/main/java/com/omar/videotoolkit
          cat > app/src/main/java/com/omar/videotoolkit/Exporter.kt <<'EOF_VC'
          package com.omar.videotoolkit

          import android.content.Context
          import android.os.Handler
          import android.os.Looper
          import androidx.annotation.OptIn
          import androidx.media3.common.MimeTypes
          import androidx.media3.common.util.UnstableApi
          import androidx.media3.transformer.AudioEncoderSettings
          import androidx.media3.transformer.Composition
          import androidx.media3.transformer.DefaultEncoderFactory
          import androidx.media3.transformer.EditedMediaItem
          import androidx.media3.transformer.EditedMediaItemSequence
          import androidx.media3.transformer.ExportException
          import androidx.media3.transformer.ExportResult
          import androidx.media3.transformer.ProgressHolder
          import androidx.media3.transformer.Transformer
          import androidx.media3.transformer.VideoEncoderSettings
          import java.io.File

          /** غلاف حول Media3 Transformer مع شريط تقدّم */
          @OptIn(UnstableApi::class)
          class Exporter(private val ctx: Context) {

              var onProgress: (Int) -> Unit = {}
              var onDone: (File) -> Unit = {}
              var onError: (String) -> Unit = {}

              private var transformer: Transformer? = null
              private var output: File? = null
              private val handler = Handler(Looper.getMainLooper())
              private val holder = ProgressHolder()

              val running get() = transformer != null

              /**
               * @param videoMime null = بدون مسار فيديو (صوت فقط)
               * @param videoBitrate 0 = تلقائي
               * @param audioBitrate 0 = تلقائي
               */
              fun start(items: List<EditedMediaItem>, out: File, videoMime: String?, videoBitrate: Int, audioBitrate: Int) {
                  output = out
                  val ef = DefaultEncoderFactory.Builder(ctx).setEnableFallback(true)
                  if (videoBitrate > 0) {
                      ef.setRequestedVideoEncoderSettings(VideoEncoderSettings.Builder().setBitrate(videoBitrate).build())
                  }
                  if (audioBitrate > 0) {
                      ef.setRequestedAudioEncoderSettings(AudioEncoderSettings.Builder().setBitrate(audioBitrate).build())
                  }
                  val builder = Transformer.Builder(ctx)
                      .setEncoderFactory(ef.build())
                      .setAudioMimeType(MimeTypes.AUDIO_AAC)
                  if (videoMime != null) builder.setVideoMimeType(videoMime)
                  builder.addListener(object : Transformer.Listener {
                      override fun onCompleted(composition: Composition, exportResult: ExportResult) {
                          stopTicking()
                          transformer = null
                          onDone(out)
                      }

                      override fun onError(composition: Composition, exportResult: ExportResult, exportException: ExportException) {
                          stopTicking()
                          transformer = null
                          out.delete()
                          onError(exportException.localizedMessage ?: exportException.errorCodeName)
                      }
                  })
                  val t = builder.build()
                  transformer = t
                  try {
                      val composition = Composition.Builder(EditedMediaItemSequence(items)).build()
                      t.start(composition, out.absolutePath)
                      handler.post(tick)
                  } catch (e: Exception) {
                      transformer = null
                      onError(e.localizedMessage ?: e.toString())
                  }
              }

              fun cancel() {
                  stopTicking()
                  transformer?.cancel()
                  transformer = null
                  output?.delete()
              }

              private fun stopTicking() = handler.removeCallbacks(tick)

              private val tick = object : Runnable {
                  override fun run() {
                      val t = transformer ?: return
                      if (t.getProgress(holder) == Transformer.PROGRESS_STATE_AVAILABLE) onProgress(holder.progress)
                      handler.postDelayed(this, 350)
                  }
              }

              companion object {
                  /** اختيار الضلع القصير المناسب لمعدل بت معيّن */
                  fun shortSideFor(bitrate: Int): Int = when {
                      bitrate >= 4_000_000 -> 1080
                      bitrate >= 1_800_000 -> 720
                      bitrate >= 1_000_000 -> 540
                      bitrate >= 600_000 -> 480
                      bitrate >= 330_000 -> 360
                      bitrate >= 180_000 -> 270
                      else -> 240
                  }

                  /** الارتفاع الناتج ليصبح الضلع القصير = target (بدون تكبير). يُرجع 0 إذا لا حاجة للتصغير */
                  fun targetHeight(w: Int, h: Int, targetShort: Int): Int {
                      if (w <= 0 || h <= 0) return targetShort
                      if (minOf(w, h) <= targetShort) return 0
                      var th = if (h > w) (h.toDouble() * targetShort / w).toInt() else targetShort
                      th -= th % 2
                      return th
                  }
              }
          }
          EOF_VC
          mkdir -p app/src/main/java/com/omar/videotoolkit
          cat > app/src/main/java/com/omar/videotoolkit/GifEncoder.kt <<'EOF_VC'
          package com.omar.videotoolkit

          import android.graphics.Bitmap
          import java.io.BufferedOutputStream
          import java.io.File
          import java.io.FileOutputStream
          import java.io.OutputStream

          /**
           * مُرمِّز GIF بسيط بلوحة ألوان ثابتة (6×7×6 = 252 لوناً) مع تنعيم Bayer.
           * لا يحتاج أي مكتبة خارجية.
           */
          class GifEncoder(file: File, private val width: Int, private val height: Int, private val delayCs: Int) {

              private val out: OutputStream = BufferedOutputStream(FileOutputStream(file), 1 shl 16)
              private val indexed = ByteArray(width * height)
              private val pixels = IntArray(width * height)

              private val bayer = intArrayOf(
                  0, 8, 2, 10,
                  12, 4, 14, 6,
                  3, 11, 1, 9,
                  15, 7, 13, 5
              )

              init {
                  out.write("GIF89a".toByteArray())
                  writeShort(width); writeShort(height)
                  out.write(0xF7)          // جدول ألوان عام بحجم 256
                  out.write(0); out.write(0)
                  // جدول الألوان
                  for (i in 0 until 256) {
                      if (i < 252) {
                          val r = i / 42; val g = (i / 6) % 7; val b = i % 6
                          out.write(r * 51); out.write((g * 255) / 6); out.write(b * 51)
                      } else {
                          out.write(0); out.write(0); out.write(0)
                      }
                  }
                  // تكرار لا نهائي
                  out.write(0x21); out.write(0xFF); out.write(0x0B)
                  out.write("NETSCAPE2.0".toByteArray())
                  out.write(0x03); out.write(0x01); writeShort(0); out.write(0x00)
              }

              fun addFrame(src: Bitmap) {
                  val bmp = if (src.width != width || src.height != height)
                      Bitmap.createScaledBitmap(src, width, height, true) else src
                  bmp.getPixels(pixels, 0, width, 0, 0, width, height)
                  for (y in 0 until height) {
                      for (x in 0 until width) {
                          val p = pixels[y * width + x]
                          val t = bayer[(y and 3) * 4 + (x and 3)] - 8   // -8..7
                          val r = (((p shr 16) and 0xFF) + t * 3).coerceIn(0, 255)
                          val g = (((p shr 8) and 0xFF) + t * 3).coerceIn(0, 255)
                          val b = ((p and 0xFF) + t * 3).coerceIn(0, 255)
                          val ri = (r * 5 + 127) / 255
                          val gi = (g * 6 + 127) / 255
                          val bi = (b * 5 + 127) / 255
                          indexed[y * width + x] = (ri * 42 + gi * 6 + bi).toByte()
                      }
                  }
                  // Graphic Control Extension
                  out.write(0x21); out.write(0xF9); out.write(0x04)
                  out.write(0x04)              // disposal = 1
                  writeShort(delayCs)
                  out.write(0); out.write(0)
                  // Image Descriptor
                  out.write(0x2C)
                  writeShort(0); writeShort(0); writeShort(width); writeShort(height)
                  out.write(0x00)
                  lzw()
                  if (bmp !== src) bmp.recycle()
              }

              fun finish() {
                  out.write(0x3B)
                  out.flush()
                  out.close()
              }

              private fun writeShort(v: Int) {
                  out.write(v and 0xFF); out.write((v shr 8) and 0xFF)
              }

              // ---------------------------------------------------------------- LZW
              private var curAccum = 0
              private var curBits = 0
              private val block = ByteArray(256)
              private var blockLen = 0
              private var nBits = 9
              private var maxCode = 511
              private var freeEnt = 258
              private var clearFlag = false

              private fun lzw() {
                  val clearCode = 256
                  val eofCode = 257
                  val maxMaxCode = 4096
                  val table = HashMap<Int, Int>(8192)

                  out.write(8)  // min code size
                  curAccum = 0; curBits = 0; blockLen = 0
                  nBits = 9; maxCode = 511; freeEnt = 258; clearFlag = false

                  output(clearCode)
                  var ent = indexed[0].toInt() and 0xFF
                  for (i in 1 until indexed.size) {
                      val c = indexed[i].toInt() and 0xFF
                      val key = (c shl 12) or ent
                      val code = table[key]
                      if (code != null) {
                          ent = code
                          continue
                      }
                      output(ent)
                      ent = c
                      if (freeEnt < maxMaxCode) {
                          table[key] = freeEnt++
                      } else {
                          table.clear()
                          freeEnt = clearCode + 2
                          clearFlag = true
                          output(clearCode)
                      }
                  }
                  output(ent)
                  output(eofCode)
                  // تفريغ ما تبقى
                  while (curBits > 0) {
                      addByte(curAccum and 0xFF)
                      curAccum = curAccum ushr 8
                      curBits -= 8
                  }
                  flushBlock()
                  out.write(0)  // نهاية بيانات الصورة
              }

              private fun output(code: Int) {
                  curAccum = curAccum or (code shl curBits)
                  curBits += nBits
                  while (curBits >= 8) {
                      addByte(curAccum and 0xFF)
                      curAccum = curAccum ushr 8
                      curBits -= 8
                  }
                  if (freeEnt > maxCode || clearFlag) {
                      if (clearFlag) {
                          nBits = 9
                          maxCode = 511
                          clearFlag = false
                      } else {
                          nBits++
                          maxCode = if (nBits == 12) 4096 else (1 shl nBits) - 1
                      }
                  }
              }

              private fun addByte(b: Int) {
                  block[blockLen++] = b.toByte()
                  if (blockLen >= 254) flushBlock()
              }

              private fun flushBlock() {
                  if (blockLen > 0) {
                      out.write(blockLen)
                      out.write(block, 0, blockLen)
                      blockLen = 0
                  }
              }
          }
          EOF_VC
          mkdir -p app/src/main/java/com/omar/videotoolkit
          cat > app/src/main/java/com/omar/videotoolkit/MainActivity.kt <<'EOF_VC'
          package com.omar.videotoolkit

          import android.content.Intent
          import android.graphics.Color
          import android.graphics.drawable.GradientDrawable
          import android.os.Bundle
          import android.view.Gravity
          import android.view.View
          import android.widget.FrameLayout
          import android.widget.ImageView
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import androidx.appcompat.app.AppCompatActivity
          import com.google.android.material.dialog.MaterialAlertDialogBuilder

          class MainActivity : AppCompatActivity() {

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  Lang.load(this)
                  buildUi()
              }

              private fun open(tool: Tool) {
                  startActivity(Intent(this, ToolActivity::class.java).putExtra("tool", tool.name))
              }

              private fun buildUi() {
                  val frame = FrameLayout(this).apply {
                      setBackgroundColor(C.BG)
                      layoutDirection = Lang.dir
                  }
                  val scroll = ScrollView(this)
                  val root = vbox().apply { setPadding(dp(18), dp(14), dp(18), dp(110)) }
                  scroll.addView(root)
                  frame.addView(scroll, FrameLayout.LayoutParams(-1, -1))

                  // ---------- الترويسة
                  val header = hbox()
                  header.addView(ImageView(this).apply {
                      setImageResource(R.drawable.ic_launcher)
                      clipToOutline = true
                      background = round(C.CARD, 14f)
                  }, lp(w = dp(48), h = dp(48)))
                  header.addView(vbox().apply {
                      addView(label(tr("ضاغط الفيديو", "VIDEO"), 22f, C.TEXT, true))
                      addView(label(tr("PRO • أدوات الفيديو", "COMPRESSOR PRO"), 13f, C.CYAN, true))
                  }, lp(w = 0, weight = 1f, start = 12))
                  header.addView(label(if (Lang.ar) "EN" else "ع", 15f, C.TEXT, true).apply {
                      gravity = Gravity.CENTER
                      background = clickable(round(C.CARD2, 14f))
                      setOnClickListener { Lang.set(this@MainActivity, !Lang.ar); recreate() }
                  }, lp(w = dp(46), h = dp(46), end = 8))
                  header.addView(label("📁", 20f).apply {
                      gravity = Gravity.CENTER
                      background = clickable(round(C.CARD2, 14f))
                      setOnClickListener { startActivity(Intent(this@MainActivity, CreationsActivity::class.java)) }
                  }, lp(w = dp(46), h = dp(46)))
                  root.addView(header, lp())

                  // ---------- الشريط الملوّن
                  root.addView(View(this).apply {
                      background = gradient(intArrayOf(C.CYAN, C.PURPLE, C.PINK, C.ORANGE), 4f,
                          GradientDrawable.Orientation.LEFT_RIGHT)
                  }, lp(h = dp(7), top = 16))

                  // ---------- البطاقة المميزة
                  val banner = FrameLayout(this).apply {
                      background = clickable(GradientDrawable(GradientDrawable.Orientation.LEFT_RIGHT,
                          intArrayOf(Color.parseColor("#1B2333"), Color.parseColor("#2A1838"))).apply {
                          cornerRadius = dpf(20f)
                          setStroke(dp(2), C.PURPLE)
                      })
                      isClickable = true
                      setOnClickListener { open(Tool.TARGET) }
                  }
                  val bannerRow = hbox().apply { setPadding(dp(16), dp(18), dp(16), dp(18)) }
                  bannerRow.addView(label("📲", 40f), lp(w = -2))
                  bannerRow.addView(vbox().apply {
                      addView(label(tr("صغّر الفيديو لحجم محدد", "Shrink to an exact size"), 13f, C.CYAN))
                      addView(label(tr("جاهز للإرسال: واتساب • تيليجرام • Claude", "Ready for WhatsApp • Telegram • Claude"),
                          17f, C.TEXT, true))
                  }, lp(w = 0, weight = 1f, start = 12))
                  banner.addView(bannerRow)
                  banner.addView(label(tr("جديد", "NEW"), 12f, C.TEXT, true).apply {
                      background = round(C.PINK, 8f)
                      setPadding(dp(10), dp(3), dp(10), dp(3))
                  }, FrameLayout.LayoutParams(-2, -2, Gravity.TOP or Gravity.END).apply { setMargins(0, dp(8), dp(10), 0) })
                  root.addView(banner, lp(top = 18))

                  // ---------- ثلاث بطاقات كبيرة
                  val big = hbox()
                  val bigTools = listOf(
                      Tool.COMPRESS to intArrayOf(Color.parseColor("#FB7185"), Color.parseColor("#F59E0B")),
                      Tool.AUDIO to intArrayOf(Color.parseColor("#4F46E5"), Color.parseColor("#C026D3")),
                      Tool.CONVERT to intArrayOf(Color.parseColor("#8B5CF6"), Color.parseColor("#06B6D4")),
                  )
                  bigTools.forEachIndexed { i, (t, colors) ->
                      big.addView(vbox(10).apply {
                          gravity = Gravity.CENTER
                          background = clickable(gradient(colors, 20f))
                          isClickable = true
                          setOnClickListener { open(t) }
                          addView(label(t.emoji, 34f).apply { gravity = Gravity.CENTER }, lp())
                          addView(label(t.title, 14f, C.TEXT, true).apply { gravity = Gravity.CENTER }, lp(top = 8))
                      }, lp(w = 0, h = dp(132), weight = 1f, start = if (i == 0) 0 else 5, end = if (i == 2) 0 else 5))
                  }
                  root.addView(big, lp(top = 18))

                  // ---------- أدوات GIF والصور
                  root.addView(label(tr("أدوات GIF والصور", "GIF & Photo Tools"), 24f, C.TEXT, true), lp(top = 24, bottom = 12))
                  val gifRow = hbox()
                  listOf(Tool.GIF to Color.parseColor("#0EA5E9"), Tool.FRAME to Color.parseColor("#22C55E"))
                      .forEachIndexed { i, (t, color) ->
                          gifRow.addView(hbox().apply {
                              setPadding(dp(12), dp(14), dp(12), dp(14))
                              background = clickable(round(C.CARD2, 18f))
                              isClickable = true
                              setOnClickListener { open(t) }
                              addView(label(t.emoji, 24f).apply {
                                  gravity = Gravity.CENTER
                                  background = round(color, 16f)
                              }, lp(w = dp(54), h = dp(54)))
                              addView(label(t.title, 16f, C.TEXT, true), lp(w = 0, weight = 1f, start = 10))
                          }, lp(w = 0, weight = 1f, start = if (i == 0) 0 else 6, end = if (i == 0) 6 else 0))
                      }
                  root.addView(gifRow, lp())

                  // ---------- أدوات الفيديو (شبكة)
                  root.addView(label(tr("أدوات الفيديو", "Video Tools"), 24f, C.TEXT, true), lp(top = 26, bottom = 12))
                  val grid = listOf(Tool.TRIM, Tool.CROP, Tool.SLOW, Tool.FAST, Tool.ROTATE, Tool.MUTE,
                      Tool.LOOP, Tool.VOLUME, Tool.INFO)
                  grid.chunked(3).forEach { rowTools ->
                      val row = hbox()
                      rowTools.forEach { t ->
                          row.addView(vbox().apply {
                              gravity = Gravity.CENTER_HORIZONTAL
                              isClickable = true
                              setOnClickListener { open(t) }
                              addView(label(t.emoji, 30f).apply {
                                  gravity = Gravity.CENTER
                                  background = clickable(GradientDrawable().apply {
                                      shape = GradientDrawable.OVAL
                                      setColor(C.CARD)
