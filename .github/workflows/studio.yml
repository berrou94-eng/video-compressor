          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/themes.xml <<'EOF_VC'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.Material3.Dark.NoActionBar">
