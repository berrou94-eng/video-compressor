      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        run: |
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
          test -f app/build/outputs/apk/debug/app-debug.apk
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/VideoToolkit.apk

      - name: Show errors
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong" -A3 build.log | head -80

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: studio-${{ github.run_number }}
          name: Video Toolkit ${{ github.run_number }}
          files: vt/out/VideoToolkit.apk
